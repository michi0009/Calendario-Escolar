<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calendario Escolar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        /* =========================
           APP
        ========================= */

     .app {
        width: 100vw;
        height: 100dvh;
    
        display: flex;
    
        overflow-x: scroll;
        overflow-y: hidden;
    
        position: relative;
    
        scroll-behavior: smooth;
    
        scrollbar-width: none;
    }
    
    .app::-webkit-scrollbar {
        display: none;
    }


        /* =========================
           PANTALLAS
        ========================= */

        .pantalla {
            min-width: 100vw;
            width: 100vw;
            height: 100dvh;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            padding: 30px 45px;
        }


        /* =========================
           CABECERA
        ========================= */

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .titulo {
            font-size: 42px;
            font-weight: bold;
        }

        .hora {
            font-size: 32px;
            font-weight: bold;
        }
        .fecha {
            font-size: 20px;
            opacity: 0.75;
            margin-top: 4px;
        }

        /* =========================
           HORARIO
        ========================= */

        #horario {
            background: #111827;
        }

        .horario-imagen {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .horario-imagen img {
            max-width: 95%;
            max-height: 85%;

            object-fit: contain;

            border-radius: 15px;
        }


        /* =========================
           TAREAS
        ========================= */

        #tareas {
            background: #172554;

            overflow: hidden;
        }

        .lista-tareas {
            flex: 1;

            overflow-y: auto;

            padding-right: 5px;
            padding-bottom: 30px;
        }


        /* =========================
           SECCIONES DE TAREAS
        ========================= */

        .seccion-tareas {
            margin-bottom: 30px;
        }

        .titulo-seccion {
            font-size: 27px;
            font-weight: bold;

            margin-top: 10px;
            margin-bottom: 12px;

            padding-bottom: 8px;

            border-bottom: 2px solid rgba(255,255,255,0.15);
        }


        /* =========================
           TARJETA NORMAL
        ========================= */

        .tarea {
            background: rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 18px 20px;

            margin-bottom: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .tarea-nombre {
            font-size: 25px;
            font-weight: bold;
        }

        .tarea-info {
            font-size: 18px;

            opacity: 0.75;

            margin-top: 5px;
        }

        .prioridad {
            font-size: 20px;

            white-space: nowrap;
        }


        /* =========================
           VENCIDAS
        ========================= */

        .tarea-vencida {
            background: rgba(127, 29, 29, 0.45);

            border-left: 5px solid #ef4444;
        }

        .tarea-vencida .tarea-nombre {
            color: #fecaca;
        }


        /* =========================
           HECHAS
        ========================= */

        .tarea-hecha {
            background: rgba(0,0,0,0.25);

            opacity: 0.55;

            border-left: 5px solid #6b7280;
        }

        .tarea-hecha .tarea-nombre {
            text-decoration: line-through;
        }

        .tarea-hecha .tarea-info {
            text-decoration: line-through;
        }


        /* =========================
           CALENDARIO
        ========================= */

        #calendario {
            background: #312e81;

            overflow: hidden;
        }

        #listaEventos {
            flex: 1;

            overflow-y: auto;

            padding-bottom: 30px;
        }

        .evento {
            background: rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 20px;

            margin-top: 15px;
        }

        .evento-nombre {
            font-size: 25px;
            font-weight: bold;
        }

        .evento-fecha {
            font-size: 18px;

            margin-top: 5px;

            opacity: 0.75;
        }


        /* =========================
           MENSAJES
        ========================= */

        .mensaje {
            margin-top: 30px;

            font-size: 24px;

            opacity: 0.65;
        }

        .error {
            color: #fca5a5;

            font-size: 18px;

            margin-top: 20px;
        }


        /* =========================
           INDICADORES
        ========================= */

        .indicadores {
            position: fixed;

            bottom: 15px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 10;
        }

        .punto {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: white;

            opacity: 0.4;
        }

        .punto.activo {
            opacity: 1;
        }

    </style>
</head>


<body>


<div class="app" id="app">


    <!-- =========================
         PANTALLA 1
    ========================= -->

    <section class="pantalla" id="horario">

<div class="cabecera">
    <div class="titulo">🏫 HORARIO</div>

    <div style="text-align: right;">
        <div class="hora" id="hora">00:00</div>
        <div class="fecha" id="fecha">20 de agosto de 2026</div>
    </div>
</div>

        <div class="horario-imagen">

            <img
                src="horario.png"
                alt="Horario escolar"
            >

        </div>

    </section>



    <!-- =========================
         PANTALLA 2
    ========================= -->

    <section class="pantalla" id="tareas">

        <div class="cabecera">

            <div class="titulo">
                📋 TAREAS
            </div>

            <div class="hora" id="hora2">
                00:00
            </div>

        </div>


        <div class="lista-tareas" id="listaTareas">

            <div class="mensaje">
                Cargando tareas...
            </div>

        </div>

    </section>



    <!-- =========================
         PANTALLA 3
    ========================= -->

    <section class="pantalla" id="calendario">

        <div class="cabecera">

            <div class="titulo">
                📅 CALENDARIO
            </div>

            <div class="hora" id="hora3">
                00:00
            </div>

        </div>


        <div id="listaEventos">

            <div class="mensaje">
                Cargando eventos...
            </div>

        </div>

    </section>

</div>



<!-- =========================
     INDICADORES
========================= -->

<div class="indicadores">

    <div class="punto activo"></div>

    <div class="punto"></div>

    <div class="punto"></div>

</div>



<script>


/* =========================
   API
========================= */

const API =
    "https://calendario-escolar-api.elkitsunelegendario.workers.dev";



/* =========================
   HORA
========================= */

function actualizarHora() {

    const ahora = new Date();

    const horas = String(ahora.getHours()).padStart(2, "0");
    const minutos = String(ahora.getMinutes()).padStart(2, "0");

    const hora = horas + ":" + minutos;

    document.getElementById("hora").textContent = hora;
    document.getElementById("hora2").textContent = hora;
    document.getElementById("hora3").textContent = hora;

    const fecha = ahora.toLocaleDateString("es-ES", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("fecha").textContent =
        fecha.charAt(0).toUpperCase() + fecha.slice(1);
}


actualizarHora();

setInterval(actualizarHora, 1000);



/* =========================
   TEXTO DE NOTION
========================= */

function obtenerTexto(propiedad) {

    if (!propiedad) return "";


    if (propiedad.type === "title") {

        return propiedad.title
            .map(x => x.plain_text)
            .join("");

    }


    if (propiedad.type === "rich_text") {

        return propiedad.rich_text
            .map(x => x.plain_text)
            .join("");

    }


    if (propiedad.type === "select") {

        return propiedad.select?.name || "";

    }


    if (propiedad.type === "status") {

        return propiedad.status?.name || "";

    }


    if (propiedad.type === "formula") {

        return propiedad.formula?.string || "";

    }


    return "";

}



/* =========================
   FECHA
========================= */

function obtenerFecha(propiedad) {

    if (
        !propiedad ||
        propiedad.type !== "date"
    ) {
        return "";
    }


    return propiedad.date?.start || "";

}



/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

    if (!fecha) return "";


    const fechaObj =
        new Date(fecha);


    if (isNaN(fechaObj)) {
        return fecha;
    }


    return fechaObj.toLocaleDateString(
        "es-ES",
        {
            day: "numeric",
            month: "long"
        }
    );

}



/* =========================
   FECHA SIN HORA
========================= */

function obtenerDia(fecha) {

    if (!fecha) return null;


    const partes =
        fecha.substring(0, 10)
            .split("-");


    if (partes.length !== 3) {
        return null;
    }


    return new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

}



/* =========================
   HOY
========================= */

function obtenerHoy() {

    const ahora = new Date();


    return new Date(
        ahora.getFullYear(),
        ahora.getMonth(),
        ahora.getDate()
    );

}



/* =========================
   PRIORIDADES
========================= */

function nivelPrioridad(prioridad) {

    const texto =
        prioridad.toLowerCase().trim();


    if (
        texto.includes("urgente") ||
        texto.includes("🔴")
    ) {
        return 1;
    }


    if (
        texto.includes("normal") ||
        texto.includes("🟡")
    ) {
        return 2;
    }


    if (
        texto.includes("baja") ||
        texto.includes("🟢")
    ) {
        return 3;
    }


    return 4;

}



/* =========================
   TAREAS
========================= */

async function cargarTareas() {

    const contenedor =
        document.getElementById("listaTareas");


    try {

        const respuesta =
            await fetch(API + "/tasks");


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML = "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📚 No hay tareas</div>';

            return;

        }



        /* =========================
           CONVERTIR TAREAS
        ========================= */

        const tareas =
            datos.results.map(pagina => {

                const propiedades =
                    pagina.properties;


                const nombre =
                    obtenerTexto(
                        propiedades["Tarea"]
                    ) ||
                    "Tarea sin nombre";


                const asignatura =
                    obtenerTexto(
                        propiedades["Asignatura "]
                    );


                const fecha =
                    obtenerFecha(
                        propiedades["Fecha de entrega"]
                    );


                const prioridad =
                    obtenerTexto(
                        propiedades["Prioridad"]
                    );


                const estado =
                    obtenerTexto(
                        propiedades["Estado"]
                    );


                return {

                    nombre,

                    asignatura,

                    fecha,

                    prioridad,

                    estado,

                    pagina

                };

            });



        /* =========================
           CLASIFICAR
        ========================= */

        const pendientes = [];

        const vencidas = [];

        const hechas = [];


        const hoy =
            obtenerHoy();


        tareas.forEach(tarea => {

            /* HECHA */

            if (
                tarea.estado
                    .toLowerCase()
                    .trim() === "hecha"
            ) {

                hechas.push(tarea);

                return;

            }


            /* SIN FECHA */

            if (!tarea.fecha) {

                pendientes.push(tarea);

                return;

            }


            const diaEntrega =
                obtenerDia(tarea.fecha);


            if (!diaEntrega) {

                pendientes.push(tarea);

                return;

            }


            /* DIFERENCIA DE DÍAS */

            const diferencia =
                Math.floor(
                    (
                        hoy.getTime() -
                        diaEntrega.getTime()
                    ) /
                    (1000 * 60 * 60 * 24)
                );


            /* VENCIDA */

            if (
                diferencia >= 1 &&
                diferencia <= 3
            ) {

                vencidas.push(tarea);

            }


            /* MÁS DE 3 DÍAS */

            else if (
                diferencia > 3
            ) {

                /* No se muestra */

            }


            /* FUTURA / HOY */

            else {

                pendientes.push(tarea);

            }

        });



        /* =========================
           ORDENAR PENDIENTES
        ========================= */

        pendientes.sort((a, b) => {

            const prioridadA =
                nivelPrioridad(a.prioridad);

            const prioridadB =
                nivelPrioridad(b.prioridad);


            if (
                prioridadA !==
                prioridadB
            ) {

                return prioridadA -
                       prioridadB;

            }


            if (!a.fecha) return 1;

            if (!b.fecha) return -1;


            return (
                new Date(a.fecha) -
                new Date(b.fecha)
            );

        });



        /* =========================
           ORDENAR VENCIDAS
        ========================= */

        vencidas.sort((a, b) => {

            const fechaA =
                obtenerDia(a.fecha);

            const fechaB =
                obtenerDia(b.fecha);


            return fechaA - fechaB;

        });



        /* =========================
           ORDENAR HECHAS
        ========================= */

        hechas.sort((a, b) => {

            const fechaA =
                a.pagina.last_edited_time
                    ? new Date(
                        a.pagina.last_edited_time
                    )
                    : new Date(0);


            const fechaB =
                b.pagina.last_edited_time
                    ? new Date(
                        b.pagina.last_edited_time
                    )
                    : new Date(0);


            return fechaB - fechaA;

        });



        /* =========================
           CREAR SECCIONES
        ========================= */

        crearSeccion(
            contenedor,
            "⚠️ VENCIDAS",
            vencidas,
            "vencida"
        );


        crearSeccion(
            contenedor,
            "📋 PENDIENTES",
            pendientes,
            "normal"
        );


        crearSeccion(
            contenedor,
            "✅ HECHAS",
            hechas,
            "hecha"
        );


    } catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar las tareas</div>';

    }

}



/* =========================
   CREAR SECCIÓN
========================= */

function crearSeccion(
    contenedor,
    titulo,
    tareas,
    tipo
) {

    const seccion =
        document.createElement("div");


    seccion.className =
        "seccion-tareas";


    const encabezado =
        document.createElement("div");


    encabezado.className =
        "titulo-seccion";


    encabezado.textContent =
        titulo;


    seccion.appendChild(
        encabezado
    );


    if (tareas.length === 0) {

        const mensaje =
            document.createElement("div");


        mensaje.className =
            "mensaje";


        if (tipo === "vencida") {

            mensaje.textContent =
                "🎉 No hay tareas vencidas";

        }

        else if (tipo === "normal") {

            mensaje.textContent =
                "📚 No hay tareas pendientes";

        }

        else {

            mensaje.textContent =
                "✅ No hay tareas hechas";

        }


        seccion.appendChild(
            mensaje
        );


    }


    tareas.forEach(
        tareaDatos => {

            const tarea =
                document.createElement("div");


            tarea.className =
                "tarea";


            if (
                tipo === "vencida"
            ) {

                tarea.classList.add(
                    "tarea-vencida"
                );

            }


            if (
                tipo === "hecha"
            ) {

                tarea.classList.add(
                    "tarea-hecha"
                );

            }


            tarea.innerHTML = `

                <div>

                    <div class="tarea-nombre">

                        ${
                            tareaDatos.nombre
                        }

                    </div>


                    <div class="tarea-info">

                        ${
                            tareaDatos.asignatura ||
                            "Sin asignatura"
                        }

                        ${
                            tareaDatos.fecha
                                ? " · " +
                                  formatearFecha(
                                      tareaDatos.fecha
                                  )
                                : ""
                        }

                    </div>

                </div>


                <div class="prioridad">

                    ${
                        tareaDatos.prioridad ||
                        (
                            tipo === "vencida"
                                ? "⚠️ Vencida"
                                : ""
                        )
                    }

                </div>

            `;


            seccion.appendChild(
                tarea
            );

        }
    );


    contenedor.appendChild(
        seccion
    );

}



/* =========================
   EVENTOS
========================= */

async function cargarEventos() {

    const contenedor =
        document.getElementById(
            "listaEventos"
        );


    try {

        const respuesta =
            await fetch(
                API + "/events"
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML = "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📅 No hay eventos</div>';

            return;

        }


        const eventos =
            datos.results.map(
                pagina => {

                    const propiedades =
                        pagina.properties;


                    let nombre = "";

                    let fecha = "";


                    for (
                        const clave in propiedades
                    ) {

                        const propiedad =
                            propiedades[clave];


                        if (
                            !nombre &&
                            propiedad.type ===
                            "title"
                        ) {

                            nombre =
                                obtenerTexto(
                                    propiedad
                                );

                        }


                        if (
                            !fecha &&
                            propiedad.type ===
                            "date"
                        ) {

                            fecha =
                                obtenerFecha(
                                    propiedad
                                );

                        }

                    }


                    return {

                        nombre:
                            nombre ||
                            "Evento sin nombre",

                        fecha

                    };

                }
            );



        /* =========================
           ORDENAR EVENTOS
        ========================= */

        eventos.sort((a, b) => {

            if (!a.fecha) return 1;

            if (!b.fecha) return -1;


            return (
                new Date(a.fecha) -
                new Date(b.fecha)
            );

        });



        eventos.forEach(
            eventoDatos => {

                const evento =
                    document.createElement(
                        "div"
                    );


                evento.className =
                    "evento";


                evento.innerHTML = `

                    <div class="evento-nombre">

                        ${
                            eventoDatos.nombre
                        }

                    </div>


                    <div class="evento-fecha">

                        ${
                            eventoDatos.fecha
                                ? formatearFecha(
                                    eventoDatos.fecha
                                  )
                                : "Sin fecha"
                        }

                    </div>

                `;


                contenedor.appendChild(
                    evento
                );

            }
        );


    } catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar los eventos</div>';

    }

}



/* =========================
   CARGAR
========================= */

cargarTareas();

cargarEventos();



/* =========================
   ACTUALIZAR CADA 30 SEGUNDOS
========================= */

setInterval(() => {

    cargarTareas();

    cargarEventos();

}, 30 * 1000);



/* =========================
   ACTUALIZAR AL VOLVER
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            cargarTareas();

            cargarEventos();

        }

    }
);



/* =========================
   NAVEGACIÓN ENTRE PANTALLAS
========================= */

const app = document.getElementById("app");
const puntos = document.querySelectorAll(".punto");

let paginaActual = 0;

let inicioX = 0;
let inicioY = 0;

let moviendo = false;

const MINIMO_DESLIZAMIENTO = 140;
const DURACION_ANIMACION = 350;


/* =========================
   ACTUALIZAR PANTALLA
========================= */

function actualizarPantalla() {

    const posicion =
        paginaActual * window.innerWidth;

    app.style.transform =
        `translate3d(-${posicion}px, 0, 0)`;


    puntos.forEach((punto, indice) => {

        punto.classList.toggle(
            "activo",
            indice === paginaActual
        );

    });

}


/* =========================
   CAMBIAR PÁGINA
========================= */

function cambiarPagina(direccion) {

    /*
     * Si todavía está animándose,
     * ignoramos cualquier otro gesto.
     */

    if (moviendo) {
        return;
    }


    const nuevaPagina =
        paginaActual + direccion;


    /*
     * No permitir salir de 0-2.
     */

    if (
        nuevaPagina < 0 ||
        nuevaPagina > 2
    ) {
        return;
    }


    paginaActual =
        nuevaPagina;


    moviendo = true;


    actualizarPantalla();


    /*
     * Bloquear nuevos gestos durante
     * toda la animación.
     */

    setTimeout(() => {

        moviendo = false;

    }, DURACION_ANIMACION);

}



/* =========================
   TOUCH START
========================= */

app.addEventListener(
    "touchstart",
    evento => {

        if (moviendo) {
            return;
        }


        const toque =
            evento.touches[0];


        inicioX =
            toque.clientX;


        inicioY =
            toque.clientY;

    },
    {
        passive: true
    }
);



/* =========================
   TOUCH END
========================= */

app.addEventListener(
    "touchend",
    evento => {

        if (moviendo) {
            return;
        }


        const toque =
            evento.changedTouches[0];


        const diferenciaX =
            toque.clientX -
            inicioX;


        const diferenciaY =
            toque.clientY -
            inicioY;



        /*
         * Si el gesto es más vertical
         * que horizontal, lo ignoramos.
         */

        if (
            Math.abs(diferenciaY) >
            Math.abs(diferenciaX)
        ) {

            return;

        }



        /*
         * El usuario tiene que deslizar
         * bastante para cambiar.
         */

        if (
            Math.abs(diferenciaX) <
            MINIMO_DESLIZAMIENTO
        ) {

            return;

        }



        /*
         * IZQUIERDA
         */

        if (diferenciaX < 0) {

            cambiarPagina(1);

        }



        /*
         * DERECHA
         */

        else {

            cambiarPagina(-1);

        }

    },
    {
        passive: true
    }
);



/* =========================
   RATÓN
========================= */

let ratonActivo = false;
let ratonInicioX = 0;


app.addEventListener(
    "mousedown",
    evento => {

        if (moviendo) {
            return;
        }


        ratonActivo = true;

        ratonInicioX =
            evento.clientX;

    }
);


app.addEventListener(
    "mouseup",
    evento => {

        if (
            !ratonActivo ||
            moviendo
        ) {

            return;

        }


        ratonActivo = false;


        const diferencia =
            evento.clientX -
            ratonInicioX;



        if (
            Math.abs(diferencia) <
            MINIMO_DESLIZAMIENTO
        ) {

            return;

        }



        if (diferencia < 0) {

            cambiarPagina(1);

        }

        else {

            cambiarPagina(-1);

        }

    }
);



/* =========================
   EVITAR ARRASTRAR IMÁGENES
========================= */

document
    .querySelectorAll("img")
    .forEach(img => {

        img.addEventListener(
            "dragstart",
            evento => {
                evento.preventDefault();
            }
        );

    });



/* =========================
   AJUSTAR AL CAMBIAR
   EL TAMAÑO DE LA VENTANA
========================= */

window.addEventListener(
    "resize",
    () => {

        actualizarPantalla();

    }
);



/* =========================
   INICIO
========================= */

actualizarPantalla();
</script>
