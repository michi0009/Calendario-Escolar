<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calendario Escolar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: none;
            overflow-x: hidden;
            touch-action: pan-y;
            scrollbar-width: none;

            /* Deslizamiento más controlado */
            overscroll-behavior-x: contain;
            scroll-behavior: smooth;
        }

        .app::-webkit-scrollbar {
            display: none;
        }

        .pantalla {
            min-width: 100vw;
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 30px 45px;
        }

        /* CABECERA */

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .titulo {
            font-size: 42px;
            font-weight: bold;
        }

        .hora {
            font-size: 32px;
            font-weight: bold;
        }

        /* HORARIO */

        #horario {
            background: #111827;
        }

        .horario-imagen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .horario-imagen img {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 15px;
        }

        /* TAREAS */

        #tareas {
            background: #172554;
        }

        .lista {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .tarea {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tarea-nombre {
            font-size: 25px;
            font-weight: bold;
        }

        .tarea-info {
            font-size: 18px;
            opacity: 0.75;
            margin-top: 5px;
        }

        .prioridad {
            font-size: 20px;
            white-space: nowrap;
        }

        /* CALENDARIO */

        #calendario {
            background: #312e81;
        }

        #listaEventos {
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .evento {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
        }

        .evento-nombre {
            font-size: 25px;
            font-weight: bold;
        }

        .evento-fecha {
            font-size: 18px;
            margin-top: 5px;
            opacity: 0.75;
        }

        .mensaje {
            margin-top: 30px;
            font-size: 24px;
            opacity: 0.65;
        }

        .error {
            color: #fca5a5;
            font-size: 18px;
            margin-top: 20px;
        }

        /* INDICADORES */

        .indicadores {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .punto {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            opacity: 0.4;
        }

        .punto.activo {
            opacity: 1;
        }
    </style>
</head>

<body>

<div class="app" id="app">

    <!-- PANTALLA 1 -->
    <section class="pantalla" id="horario">

        <div class="cabecera">
            <div class="titulo">🏫 HORARIO</div>
            <div class="hora" id="hora">00:00</div>
        </div>

        <div class="horario-imagen">
            <img src="horario.png" alt="Horario escolar">
        </div>

    </section>


    <!-- PANTALLA 2 -->
    <section class="pantalla" id="tareas">

        <div class="cabecera">
            <div class="titulo">📋 PENDIENTES</div>
            <div class="hora" id="hora2">00:00</div>
        </div>

        <div class="lista" id="listaTareas">
            <div class="mensaje">Cargando tareas...</div>
        </div>

    </section>


    <!-- PANTALLA 3 -->
    <section class="pantalla" id="calendario">

        <div class="cabecera">
            <div class="titulo">📅 CALENDARIO</div>
            <div class="hora" id="hora3">00:00</div>
        </div>

        <div id="listaEventos">
            <div class="mensaje">Cargando eventos...</div>
        </div>

    </section>

</div>


<div class="indicadores">
    <div class="punto activo"></div>
    <div class="punto"></div>
    <div class="punto"></div>
</div>


<script>

const API = "https://calendario-escolar-api.elkitsunelegendario.workers.dev";


/* =========================
   HORA
========================= */

function actualizarHora() {

    const ahora = new Date();

    const horas = String(ahora.getHours()).padStart(2, "0");
    const minutos = String(ahora.getMinutes()).padStart(2, "0");

    const hora = horas + ":" + minutos;

    document.getElementById("hora").textContent = hora;
    document.getElementById("hora2").textContent = hora;
    document.getElementById("hora3").textContent = hora;
}

actualizarHora();

setInterval(actualizarHora, 1000);


/* =========================
   NOTION
========================= */

function obtenerTexto(propiedad) {

    if (!propiedad) return "";

    if (propiedad.type === "title") {
        return propiedad.title
            .map(x => x.plain_text)
            .join("");
    }

    if (propiedad.type === "rich_text") {
        return propiedad.rich_text
            .map(x => x.plain_text)
            .join("");
    }

    if (propiedad.type === "select") {
        return propiedad.select?.name || "";
    }

    if (propiedad.type === "status") {
        return propiedad.status?.name || "";
    }

    if (propiedad.type === "formula") {
        return propiedad.formula?.string || "";
    }

    return "";
}


function obtenerFecha(propiedad) {

    if (!propiedad || propiedad.type !== "date") {
        return "";
    }

    return propiedad.date?.start || "";
}


function formatearFecha(fecha) {

    if (!fecha) return "";

    const fechaObj = new Date(fecha);

    if (isNaN(fechaObj)) {
        return fecha;
    }

    return fechaObj.toLocaleDateString("es-ES", {
        day: "numeric",
        month: "long"
    });
}


/* =========================
   PRIORIDADES
========================= */

function nivelPrioridad(prioridad) {

    const texto = prioridad.toLowerCase().trim();

    if (
        texto.includes("urgente") ||
        texto.includes("🔴")
    ) {
        return 1;
    }

    if (
        texto.includes("normal") ||
        texto.includes("🟡")
    ) {
        return 2;
    }

    if (
        texto.includes("baja") ||
        texto.includes("🟢")
    ) {
        return 3;
    }

    return 4;
}


/* =========================
   TAREAS
========================= */

async function cargarTareas() {

    const contenedor = document.getElementById("listaTareas");

    try {

        const respuesta = await fetch(API + "/tasks");

        if (!respuesta.ok) {
            throw new Error("Error HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        contenedor.innerHTML = "";

        if (!datos.results || datos.results.length === 0) {

            contenedor.innerHTML =
                '<div class="mensaje">📚 No hay tareas pendientes</div>';

            return;
        }

        const tareas = datos.results.map(pagina => {

            const propiedades = pagina.properties;

            const nombre =
                obtenerTexto(propiedades["Tarea"]) ||
                "Tarea sin nombre";

            const asignatura =
                obtenerTexto(propiedades["Asignatura "]);

            const fecha =
                obtenerFecha(propiedades["Fecha de entrega"]);

            const prioridad =
                obtenerTexto(propiedades["Prioridad"]);

            return {
                nombre,
                asignatura,
                fecha,
                prioridad
            };

        });


        /* Ordenar por prioridad */

        tareas.sort((a, b) => {

            const prioridadA = nivelPrioridad(a.prioridad);
            const prioridadB = nivelPrioridad(b.prioridad);

            if (prioridadA !== prioridadB) {
                return prioridadA - prioridadB;
            }

            /* Si tienen la misma prioridad,
               ordenar por fecha */

            if (!a.fecha) return 1;
            if (!b.fecha) return -1;

            return new Date(a.fecha) - new Date(b.fecha);

        });


        tareas.forEach(tareaDatos => {

            const tarea = document.createElement("div");

            tarea.className = "tarea";

            tarea.innerHTML = `
                <div>
                    <div class="tarea-nombre">
                        ${tareaDatos.nombre}
                    </div>

                    <div class="tarea-info">
                        ${tareaDatos.asignatura || "Sin asignatura"}
                        ${
                            tareaDatos.fecha
                                ? " · " + formatearFecha(tareaDatos.fecha)
                                : ""
                        }
                    </div>
                </div>

                <div class="prioridad">
                    ${tareaDatos.prioridad || ""}
                </div>
            `;

            contenedor.appendChild(tarea);

        });

    } catch (error) {

        console.error(error);

        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar las tareas</div>';
    }
}


/* =========================
   EVENTOS
========================= */

async function cargarEventos() {

    const contenedor = document.getElementById("listaEventos");

    try {

        const respuesta = await fetch(API + "/events");

        if (!respuesta.ok) {
            throw new Error("Error HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        contenedor.innerHTML = "";

        if (!datos.results || datos.results.length === 0) {

            contenedor.innerHTML =
                '<div class="mensaje">📅 No hay eventos</div>';

            return;
        }


        const eventos = datos.results.map(pagina => {

            const propiedades = pagina.properties;

            let nombre = "";
            let fecha = "";

            for (const clave in propiedades) {

                const propiedad = propiedades[clave];

                if (!nombre && propiedad.type === "title") {
                    nombre = obtenerTexto(propiedad);
                }

                if (!fecha && propiedad.type === "date") {
                    fecha = obtenerFecha(propiedad);
                }

            }

            return {
                nombre: nombre || "Evento sin nombre",
                fecha
            };

        });


        /* Ordenar de más cercano a más lejano */

        eventos.sort((a, b) => {

            if (!a.fecha) return 1;
            if (!b.fecha) return -1;

            return new Date(a.fecha) - new Date(b.fecha);

        });


        eventos.forEach(eventoDatos => {

            const evento = document.createElement("div");

            evento.className = "evento";

            evento.innerHTML = `
                <div class="evento-nombre">
                    ${eventoDatos.nombre}
                </div>

                <div class="evento-fecha">
                    ${
                        eventoDatos.fecha
                            ? formatearFecha(eventoDatos.fecha)
                            : "Sin fecha"
                    }
                </div>
            `;

            contenedor.appendChild(evento);

        });

    } catch (error) {

        console.error(error);

        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar los eventos</div>';
    }
}


/* =========================
   CARGAR DATOS
========================= */

cargarTareas();
cargarEventos();


/* Actualizar cada 30 segundos */

setInterval(() => {

    cargarTareas();
    cargarEventos();

}, 30 * 1000);


/* Actualizar al volver a la página */

document.addEventListener("visibilitychange", () => {

    if (!document.hidden) {

        cargarTareas();
        cargarEventos();

    }

});


/* =========================
   DESLIZAMIENTO CONTROLADO
========================= */

const app = document.getElementById("app");
const puntos = document.querySelectorAll(".punto");

let paginaActual = 0;

let inicioX = 0;
let inicioY = 0;

const MINIMO_DESLIZAMIENTO = 120;


/* =========================
   CAMBIAR DE PÁGINA
========================= */

function irAPagina() {

    const desplazamiento =
        paginaActual * window.innerWidth;

    app.style.transform =
        `translateX(-${desplazamiento}px)`;

    actualizarIndicadores();
}


/* =========================
   INDICADORES
========================= */

function actualizarIndicadores() {

    puntos.forEach((punto, indice) => {

        punto.classList.toggle(
            "activo",
            indice === paginaActual
        );

    });

}


/* =========================
   TOUCH
========================= */

app.addEventListener("touchstart", (evento) => {

    const toque = evento.touches[0];

    inicioX = toque.clientX;
    inicioY = toque.clientY;

}, { passive: true });


app.addEventListener("touchend", (evento) => {

    const toque = evento.changedTouches[0];

    const diferenciaX =
        toque.clientX - inicioX;

    const diferenciaY =
        toque.clientY - inicioY;


    /* Ignorar movimientos verticales */

    if (
        Math.abs(diferenciaY) >
        Math.abs(diferenciaX)
    ) {
        return;
    }


    /* Deslizamiento demasiado pequeño */

    if (
        Math.abs(diferenciaX) <
        MINIMO_DESLIZAMIENTO
    ) {
        return;
    }


    /* IZQUIERDA */

    if (diferenciaX < 0) {

        if (paginaActual < 2) {
            paginaActual++;
        }

    }


    /* DERECHA */

    else {

        if (paginaActual > 0) {
            paginaActual--;
        }

    }


    irAPagina();

}, { passive: true });


/* =========================
   RATÓN
========================= */

let ratonInicioX = 0;
let ratonActivo = false;


app.addEventListener("mousedown", (evento) => {

    ratonActivo = true;

    ratonInicioX =
        evento.clientX;

});


app.addEventListener("mouseup", (evento) => {

    if (!ratonActivo) return;

    ratonActivo = false;

    const diferencia =
        evento.clientX - ratonInicioX;


    if (
        Math.abs(diferencia) <
        MINIMO_DESLIZAMIENTO
    ) {
        return;
    }


    if (
        diferencia < 0 &&
        paginaActual < 2
    ) {
        paginaActual++;
    }


    if (
        diferencia > 0 &&
        paginaActual > 0
    ) {
        paginaActual--;
    }


    irAPagina();

});


/* =========================
   POSICIÓN INICIAL
========================= */

irAPagina();
/* =========================
   INDICADORES
========================= */

actualizarIndicadores();

</script>

</body>
</html>
