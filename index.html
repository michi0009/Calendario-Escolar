<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calendario Escolar</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;
        }


        /* =========================
           APP
        ========================= */

        .app {

            width: 100vw;

            /*
             * svh = altura estable del viewport.
             * Evita que la barra del navegador
             * haga que la pantalla quede cortada.
             */
            height: 100svh;

            display: flex;

            /*
             * El navegador NO hará el swipe
             * horizontal por su cuenta.
             * Lo controlamos nosotros.
             */
            overflow-x: auto;
            overflow-y: hidden;

            position: relative;

            scrollbar-width: none;

            /*
             * Permitimos el scroll vertical
             * dentro de las listas.
             */
            touch-action: pan-y;

            /*
             * Evita que el navegador haga
             * un scroll horizontal extraño.
             */
            overscroll-behavior-x: none;
        }


        .app::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           PANTALLAS
        ========================= */

        .pantalla {

            min-width: 100vw;

            width: 100vw;

            height: 100svh;

            flex-shrink: 0;

            display: flex;

            flex-direction: column;

            padding: 30px 45px;

            /*
             * Cada pantalla ocupa exactamente
             * una pantalla.
             */
            scroll-snap-align: start;
        }


        /* =========================
           CABECERA
        ========================= */

        .cabecera {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .titulo {

            font-size: 42px;

            font-weight: bold;
        }


        .hora {

            font-size: 32px;

            font-weight: bold;
        }


        .fecha {

            font-size: 20px;

            opacity: 0.75;

            margin-top: 4px;
        }


        /* =========================
           HORARIO
        ========================= */

        #horario {

            background: #111827;
        }


        .horario-imagen {

            flex: 1;

            min-height: 0;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .horario-imagen img {

            max-width: 95%;

            max-height: 85%;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 15px;

            /*
             * Evita comportamientos raros
             * al tocar la imagen.
             */
            user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================
           TAREAS
        ========================= */

        #tareas {

            background: #172554;

            overflow: hidden;
        }


        .lista-tareas {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding-right: 5px;

            padding-bottom: 30px;

            /*
             * Aquí sí permitimos scroll vertical.
             */
            touch-action: pan-y;
        }


        /* =========================
           SECCIONES DE TAREAS
        ========================= */

        .seccion-tareas {

            margin-bottom: 30px;
        }


        .titulo-seccion {

            font-size: 27px;

            font-weight: bold;

            margin-top: 10px;

            margin-bottom: 12px;

            padding-bottom: 8px;

            border-bottom:
                2px solid
                rgba(255,255,255,0.15);
        }


        /* =========================
           TARJETA NORMAL
        ========================= */

        .tarea {

            background:
                rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 18px 20px;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .tarea-nombre {

            font-size: 25px;

            font-weight: bold;
        }


        .tarea-info {

            font-size: 18px;

            opacity: 0.75;

            margin-top: 5px;
        }


        .prioridad {

            font-size: 20px;

            white-space: nowrap;
        }


        /* =========================
           VENCIDAS
        ========================= */

        .tarea-vencida {

            background:
                rgba(127, 29, 29, 0.45);

            border-left:
                5px solid #ef4444;
        }


        .tarea-vencida .tarea-nombre {

            color: #fecaca;
        }


        /* =========================
           HECHAS
        ========================= */

        .tarea-hecha {

            background:
                rgba(0,0,0,0.25);

            opacity: 0.55;

            border-left:
                5px solid #6b7280;
        }


        .tarea-hecha .tarea-nombre {

            text-decoration: line-through;
        }


        .tarea-hecha .tarea-info {

            text-decoration: line-through;
        }


        /* =========================
           CALENDARIO
        ========================= */

        #calendario {

            background: #312e81;

            overflow: hidden;
        }


        #listaEventos {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding-bottom: 30px;

            touch-action: pan-y;
        }


        .evento {

            background:
                rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 20px;

            margin-top: 15px;
        }


        .evento-nombre {

            font-size: 25px;

            font-weight: bold;
        }


        .evento-fecha {

            font-size: 18px;

            margin-top: 5px;

            opacity: 0.75;
        }


        /* =========================
           MENSAJES
        ========================= */

        .mensaje {

            margin-top: 30px;

            font-size: 24px;

            opacity: 0.65;
        }


        .error {

            color: #fca5a5;

            font-size: 18px;

            margin-top: 20px;
        }

        /* =========================
           PLAN
        ========================= */
        
        #plan {
            background: #064e3b;
            overflow: hidden;
        }
        
        #listaPlan {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 40px;
            touch-action: pan-y;
        }
        
        .dia-plan {
            margin-bottom: 30px;
        }
        
        .titulo-dia {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
        }
        
        .item-plan {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 12px;
        }
        
        .item-plan.tarea-plan {
            cursor: pointer;
        }
        
        .item-plan.tarea-plan:active {
            transform: scale(0.98);
        }
        
        .plan-nombre {
            font-size: 23px;
            font-weight: bold;
        }
        
        .plan-info {
            font-size: 17px;
            opacity: 0.75;
            margin-top: 5px;
        }
        
        .plan-aviso {
            background: rgba(255,255,255,0.07);
            border-left: 5px solid rgba(255,255,255,0.4);
        }
        
        .plan-examen {
            border-left: 5px solid #f59e0b;
        }
        
        .plan-entrega {
            border-left: 5px solid #60a5fa;
        }
        
        .plan-hecha {
            opacity: 0.45;
        }
        
        .plan-hecha .plan-nombre {
            text-decoration: line-through;
        }
        
        .casilla {
            font-size: 24px;
            margin-right: 10px;
        }
        /* =========================
           INDICADORES
        ========================= */

        .indicadores {

            position: fixed;

            bottom: 15px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 100;

            pointer-events: none;
        }


        .punto {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: white;

            opacity: 0.4;
        }


        .punto.activo {

            opacity: 1;
        }

    </style>
</head>


<body>


<div class="app" id="app">


    <!-- =========================
         PANTALLA 1
    ========================= -->

    <section class="pantalla" id="horario">

        <div class="cabecera">

            <div class="titulo">
                🏫 HORARIO
            </div>


            <div style="text-align: right;">

                <div class="hora" id="hora">
                    00:00
                </div>

                <div class="fecha" id="fecha">
                    20 de agosto de 2026
                </div>

            </div>

        </div>


        <div class="horario-imagen">

            <img
                src="horario.png"
                alt="Horario escolar"
                draggable="false"
            >

        </div>

    </section>



    <!-- =========================
         PANTALLA 2
    ========================= -->

    <section class="pantalla" id="tareas">

        <div class="cabecera">

            <div class="titulo">
                📋 TAREAS
            </div>

            <div class="hora" id="hora2">
                00:00
            </div>

        </div>


        <div
            class="lista-tareas"
            id="listaTareas"
        >

            <div class="mensaje">
                Cargando tareas...
            </div>

        </div>

    </section>



    <!-- =========================
         PANTALLA 3
    ========================= -->

    <section
        class="pantalla"
        id="calendario"
    >

        <div class="cabecera">

            <div class="titulo">
                📅 CALENDARIO
            </div>

            <div class="hora" id="hora3">
                00:00
            </div>

        </div>


        <div id="listaEventos">

            <div class="mensaje">
                Cargando eventos...
            </div>

        </div>

    </section>

     <!-- =========================
         PANTALLA 4 - PLAN
    ========================= -->

    <section class="pantalla" id="plan">

        <div class="cabecera">

            <div class="titulo">
                🎯 PLAN
            </div>

            <div class="hora" id="hora4">
                00:00
            </div>

        </div>


        <div id="listaPlan">

            <div class="mensaje">
                Generando plan...
            </div>

        </div>

    </section>

</div>



<!-- =========================
     INDICADORES
========================= -->

<div class="indicadores">

    <div class="punto activo"></div>

    <div class="punto"></div>

    <div class="punto"></div>

</div>



<script>


/* =========================
   API
========================= */

const API =
    "https://calendario-escolar-api.elkitsunelegendario.workers.dev";



/* =========================
   HORA
========================= */

function actualizarHora() {

    const ahora = new Date();

    const horas =
        String(
            ahora.getHours()
        ).padStart(2, "0");

    const minutos =
        String(
            ahora.getMinutes()
        ).padStart(2, "0");

    const hora =
        horas + ":" + minutos;


    document.getElementById(
        "hora"
    ).textContent = hora;


    document.getElementById(
        "hora2"
    ).textContent = hora;


    document.getElementById(
        "hora3"
    ).textContent = hora;


    const fecha =
        ahora.toLocaleDateString(
            "es-ES",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById(
        "fecha"
    ).textContent =
        fecha.charAt(0).toUpperCase() +
        fecha.slice(1);
}


actualizarHora();


setInterval(
    actualizarHora,
    1000
);



/* =========================
   TEXTO DE NOTION
========================= */

function obtenerTexto(propiedad) {

    if (!propiedad) return "";


    if (
        propiedad.type === "title"
    ) {

        return propiedad.title
            .map(x => x.plain_text)
            .join("");

    }


    if (
        propiedad.type === "rich_text"
    ) {

        return propiedad.rich_text
            .map(x => x.plain_text)
            .join("");

    }


    if (
        propiedad.type === "select"
    ) {

        return propiedad.select?.name || "";

    }


    if (
        propiedad.type === "status"
    ) {

        return propiedad.status?.name || "";

    }


    if (
        propiedad.type === "formula"
    ) {

        return propiedad.formula?.string || "";

    }


    return "";
}



/* =========================
   FECHA
========================= */

function obtenerFecha(propiedad) {

    if (
        !propiedad ||
        propiedad.type !== "date"
    ) {

        return "";
    }


    return propiedad.date?.start || "";
}



/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

    if (!fecha) return "";


    const fechaObj =
        new Date(fecha);


    if (isNaN(fechaObj)) {

        return fecha;
    }


    return fechaObj.toLocaleDateString(
        "es-ES",
        {
            day: "numeric",
            month: "long"
        }
    );
}



/* =========================
   FECHA SIN HORA
========================= */

function obtenerDia(fecha) {

    if (!fecha) return null;


    const partes =
        fecha
            .substring(0, 10)
            .split("-");


    if (partes.length !== 3) {

        return null;
    }


    return new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );
}



/* =========================
   HOY
========================= */

function obtenerHoy() {

    const ahora =
        new Date();


    return new Date(
        ahora.getFullYear(),
        ahora.getMonth(),
        ahora.getDate()
    );
}



/* =========================
   PRIORIDADES
========================= */

function nivelPrioridad(prioridad) {

    const texto =
        prioridad
            .toLowerCase()
            .trim();


    if (
        texto.includes("urgente") ||
        texto.includes("🔴")
    ) {

        return 1;
    }


    if (
        texto.includes("normal") ||
        texto.includes("🟡")
    ) {

        return 2;
    }


    if (
        texto.includes("baja") ||
        texto.includes("🟢")
    ) {

        return 3;
    }


    return 4;
}



/* =========================
   TAREAS
========================= */

async function cargarTareas() {

    const contenedor =
        document.getElementById(
            "listaTareas"
        );


    try {

        const respuesta =
            await fetch(
                API + "/tasks"
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML = "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📚 No hay tareas</div>';

            return;
        }


        const tareas =
            datos.results.map(
                pagina => {

                    const propiedades =
                        pagina.properties;


                    const nombre =
                        obtenerTexto(
                            propiedades["Tarea"]
                        ) ||
                        "Tarea sin nombre";


                    const asignatura =
                        obtenerTexto(
                            propiedades["Asignatura "]
                        );


                    const fecha =
                        obtenerFecha(
                            propiedades[
                                "Fecha de entrega"
                            ]
                        );


                    const prioridad =
                        obtenerTexto(
                            propiedades[
                                "Prioridad"
                            ]
                        );


                    const estado =
                        obtenerTexto(
                            propiedades[
                                "Estado"
                            ]
                        );


                    return {

                        nombre,

                        asignatura,

                        fecha,

                        prioridad,

                        estado,

                        pagina

                    };

                }
            );


        const pendientes = [];

        const vencidas = [];

        const hechas = [];


        const hoy =
            obtenerHoy();


        tareas.forEach(
            tarea => {

                if (
                    tarea.estado
                        .toLowerCase()
                        .trim() === "hecha"
                ) {

                    hechas.push(tarea);

                    return;
                }


                if (!tarea.fecha) {

                    pendientes.push(tarea);

                    return;
                }


                const diaEntrega =
                    obtenerDia(
                        tarea.fecha
                    );


                if (!diaEntrega) {

                    pendientes.push(tarea);

                    return;
                }


                const diferencia =
                    Math.floor(
                        (
                            hoy.getTime() -
                            diaEntrega.getTime()
                        ) /
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    );


                if (
                    diferencia >= 1 &&
                    diferencia <= 3
                ) {

                    vencidas.push(tarea);

                }


                else if (
                    diferencia > 3
                ) {

                    /* No mostrar */

                }


                else {

                    pendientes.push(tarea);

                }

            }
        );


        pendientes.sort(
            (a, b) => {

                const prioridadA =
                    nivelPrioridad(
                        a.prioridad
                    );


                const prioridadB =
                    nivelPrioridad(
                        b.prioridad
                    );


                if (
                    prioridadA !==
                    prioridadB
                ) {

                    return
                        prioridadA -
                        prioridadB;
                }


                if (!a.fecha) return 1;

                if (!b.fecha) return -1;


                return (
                    new Date(a.fecha) -
                    new Date(b.fecha)
                );
            }
        );


        vencidas.sort(
            (a, b) => {

                const fechaA =
                    obtenerDia(a.fecha);

                const fechaB =
                    obtenerDia(b.fecha);


                return fechaA - fechaB;
            }
        );


        hechas.sort(
            (a, b) => {

                const fechaA =
                    a.pagina.last_edited_time
                        ? new Date(
                            a.pagina
                                .last_edited_time
                        )
                        : new Date(0);


                const fechaB =
                    b.pagina.last_edited_time
                        ? new Date(
                            b.pagina
                                .last_edited_time
                        )
                        : new Date(0);


                return fechaB - fechaA;
            }
        );


        crearSeccion(
            contenedor,
            "⚠️ VENCIDAS",
            vencidas,
            "vencida"
        );


        crearSeccion(
            contenedor,
            "📋 PENDIENTES",
            pendientes,
            "normal"
        );


        crearSeccion(
            contenedor,
            "✅ HECHAS",
            hechas,
            "hecha"
        );


    }

    catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar las tareas</div>';
    }
}



/* =========================
   CREAR SECCIÓN
========================= */

function crearSeccion(
    contenedor,
    titulo,
    tareas,
    tipo
) {

    const seccion =
        document.createElement(
            "div"
        );


    seccion.className =
        "seccion-tareas";


    const encabezado =
        document.createElement(
            "div"
        );


    encabezado.className =
        "titulo-seccion";


    encabezado.textContent =
        titulo;


    seccion.appendChild(
        encabezado
    );


    if (tareas.length === 0) {

        const mensaje =
            document.createElement(
                "div"
            );


        mensaje.className =
            "mensaje";


        if (
            tipo === "vencida"
        ) {

            mensaje.textContent =
                "🎉 No hay tareas vencidas";
        }

        else if (
            tipo === "normal"
        ) {

            mensaje.textContent =
                "📚 No hay tareas pendientes";
        }

        else {

            mensaje.textContent =
                "✅ No hay tareas hechas";
        }


        seccion.appendChild(
            mensaje
        );
    }


    tareas.forEach(
        tareaDatos => {

            const tarea =
                document.createElement(
                    "div"
                );


            tarea.className =
                "tarea";


            if (
                tipo === "vencida"
            ) {

                tarea.classList.add(
                    "tarea-vencida"
                );
            }


            if (
                tipo === "hecha"
            ) {

                tarea.classList.add(
                    "tarea-hecha"
                );
            }


            tarea.innerHTML = `

                <div>

                    <div class="tarea-nombre">

                        ${tareaDatos.nombre}

                    </div>


                    <div class="tarea-info">

                        ${
                            tareaDatos.asignatura ||
                            "Sin asignatura"
                        }

                        ${
                            tareaDatos.fecha
                                ? " · " +
                                  formatearFecha(
                                      tareaDatos.fecha
                                  )
                                : ""
                        }

                    </div>

                </div>


                <div class="prioridad">

                    ${
                        tareaDatos.prioridad ||
                        (
                            tipo === "vencida"
                                ? "⚠️ Vencida"
                                : ""
                        )
                    }

                </div>

            `;


            seccion.appendChild(
                tarea
            );

        }
    );


    contenedor.appendChild(
        seccion
    );
}



/* =========================
   EVENTOS
========================= */

async function cargarEventos() {

    const contenedor =
        document.getElementById(
            "listaEventos"
        );


    try {

        const respuesta =
            await fetch(
                API + "/events"
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML = "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📅 No hay eventos</div>';

            return;
        }


        const eventos =
            datos.results.map(
                pagina => {

                    const propiedades =
                        pagina.properties;


                    let nombre = "";

                    let fecha = "";


                    for (
                        const clave in propiedades
                    ) {

                        const propiedad =
                            propiedades[clave];


                        if (
                            !nombre &&
                            propiedad.type ===
                            "title"
                        ) {

                            nombre =
                                obtenerTexto(
                                    propiedad
                                );
                        }


                        if (
                            !fecha &&
                            propiedad.type ===
                            "date"
                        ) {

                            fecha =
                                obtenerFecha(
                                    propiedad
                                );
                        }
                    }


                    return {

                        nombre:
                            nombre ||
                            "Evento sin nombre",

                        fecha

                    };
                }
            );


        eventos.sort(
            (a, b) => {

                if (!a.fecha) return 1;

                if (!b.fecha) return -1;


                return (
                    new Date(a.fecha) -
                    new Date(b.fecha)
                );
            }
        );


        eventos.forEach(
            eventoDatos => {

                const evento =
                    document.createElement(
                        "div"
                    );


                evento.className =
                    "evento";


                evento.innerHTML = `

                    <div class="evento-nombre">

                        ${eventoDatos.nombre}

                    </div>


                    <div class="evento-fecha">

                        ${
                            eventoDatos.fecha
                                ? formatearFecha(
                                    eventoDatos.fecha
                                  )
                                : "Sin fecha"
                        }

                    </div>

                `;


                contenedor.appendChild(
                    evento
                );
            }
        );

    }

    catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar los eventos</div>';
    }
}



/* =========================
   CARGAR DATOS
========================= */

cargarTareas();

cargarEventos();



/* =========================
   ACTUALIZAR CADA 30 SEGUNDOS
========================= */

setInterval(
    () => {

        cargarTareas();

        cargarEventos();

    },
    30 * 1000
);



/* =========================
   ACTUALIZAR AL VOLVER
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            cargarTareas();

            cargarEventos();

        }
    }
);



/* =====================================================
   NAVEGACIÓN
   ===================================================== */

const app =
    document.getElementById("app");


const puntos =
    document.querySelectorAll(".punto");


let paginaActual = 0;

let inicioX = 0;

let inicioY = 0;

let gestoHorizontal = false;

let moviendo = false;


const MINIMO_DESLIZAMIENTO = 120;

const DURACION_ANIMACION = 400;



/* =========================
   PUNTOS
========================= */

function actualizarPuntos() {

    puntos.forEach(
        (punto, indice) => {

            punto.classList.toggle(
                "activo",
                indice === paginaActual
            );

        }
    );
}



/* =========================
   IR A PÁGINA
========================= */

function irAPagina(numero) {

    numero =
        Math.max(
            0,
            Math.min(
                2,
                numero
            )
        );


    paginaActual = numero;

    actualizarPuntos();


    moviendo = true;


    /*
     * Movemos el scroll REAL.
     * No usamos transform.
     */

    app.scrollTo({

        left:
            numero *
            window.innerWidth,

        behavior: "smooth"

    });


    setTimeout(
        () => {

            moviendo = false;

            /*
             * Corregimos cualquier pequeño
             * error de posición.
             */

            app.scrollLeft =
                paginaActual *
                window.innerWidth;

        },
        DURACION_ANIMACION
    );
}



/* =========================
   CAMBIAR PÁGINA
========================= */

function cambiarPagina(direccion) {

    if (moviendo) {
        return;
    }


    const nuevaPagina =
        paginaActual +
        direccion;


    if (
        nuevaPagina < 0 ||
        nuevaPagina > 2
    ) {

        return;
    }


    irAPagina(
        nuevaPagina
    );
}



/* =========================
   TOUCH START
========================= */

app.addEventListener(
    "touchstart",
    evento => {

        if (moviendo) {
            return;
        }


        /*
         * Solo nos interesa el primer dedo.
         */

        if (
            evento.touches.length !== 1
        ) {

            return;
        }


        const toque =
            evento.touches[0];


        inicioX =
            toque.clientX;


        inicioY =
            toque.clientY;


        gestoHorizontal = false;

    },
    {
        passive: true
    }
);



/* =========================
   TOUCH MOVE
========================= */

app.addEventListener(
    "touchmove",
    evento => {

        if (moviendo) {
            return;
        }


        if (
            evento.touches.length !== 1
        ) {

            return;
        }


        const toque =
            evento.touches[0];


        const diferenciaX =
            toque.clientX -
            inicioX;


        const diferenciaY =
            toque.clientY -
            inicioY;


        /*
         * Cuando sabemos que el gesto es
         * horizontal, evitamos que el navegador
         * intente hacer un scroll horizontal
         * por su cuenta.
         */

        if (
            Math.abs(diferenciaX) >
            Math.abs(diferenciaY)
        ) {

            gestoHorizontal = true;

            /*
             * NO usamos preventDefault aquí
             * porque el listener es passive.
             *
             * touch-action: pan-y se encarga
             * de impedir el movimiento horizontal.
             */
        }

    },
    {
        passive: true
    }
);



/* =========================
   TOUCH END
========================= */

app.addEventListener(
    "touchend",
    evento => {

        if (moviendo) {
            return;
        }


        if (!gestoHorizontal) {
            return;
        }


        const toque =
            evento.changedTouches[0];


        const diferenciaX =
            toque.clientX -
            inicioX;


        const diferenciaY =
            toque.clientY -
            inicioY;


        /*
         * Si finalmente fue vertical,
         * no hacemos nada.
         */

        if (
            Math.abs(diferenciaY) >
            Math.abs(diferenciaX)
        ) {

            return;
        }


        /*
         * Swipe demasiado pequeño.
         */

        if (
            Math.abs(diferenciaX) <
            MINIMO_DESLIZAMIENTO
        ) {

            return;
        }


        /*
         * IZQUIERDA
         */

        if (
            diferenciaX < 0
        ) {

            cambiarPagina(1);

        }


        /*
         * DERECHA
         */

        else {

            cambiarPagina(-1);

        }


        gestoHorizontal = false;

    },
    {
        passive: true
    }
);



/* =========================
   CANCELAR TOUCH
========================= */

app.addEventListener(
    "touchcancel",
    () => {

        gestoHorizontal = false;

    },
    {
        passive: true
    }
);



/* =====================================================
   RATÓN
   ===================================================== */

let ratonActivo = false;

let ratonInicioX = 0;



app.addEventListener(
    "mousedown",
    evento => {

        if (moviendo) {
            return;
        }


        ratonActivo = true;

        ratonInicioX =
            evento.clientX;

    }
);



app.addEventListener(
    "mouseup",
    evento => {

        if (!ratonActivo) {
            return;
        }


        ratonActivo = false;


        if (moviendo) {
            return;
        }


        const diferencia =
            evento.clientX -
            ratonInicioX;


        if (
            Math.abs(diferencia) <
            MINIMO_DESLIZAMIENTO
        ) {

            return;
        }


        if (
            diferencia < 0
        ) {

            cambiarPagina(1);

        }

        else {

            cambiarPagina(-1);

        }

    }
);



/* =========================
   RATÓN CANCELADO
========================= */

app.addEventListener(
    "mouseleave",
    () => {

        ratonActivo = false;

    }
);



/* =========================
   EVITAR ARRASTRAR IMÁGENES
========================= */

document
    .querySelectorAll("img")
    .forEach(
        img => {

            img.addEventListener(
                "dragstart",
                evento => {

                    evento.preventDefault();

                }
            );

        }
    );



/* =========================
   REDIMENSIONAR
========================= */

window.addEventListener(
    "resize",
    () => {

        /*
         * Esperamos un instante para que
         * el navegador termine de actualizar
         * el viewport.
         */

        requestAnimationFrame(
            () => {

                app.scrollTo({

                    left:
                        paginaActual *
                        window.innerWidth,

                    behavior: "auto"

                });

            }
        );

    }
);


/* =========================
   INICIO
========================= */

actualizarPantalla();
    
/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => {
                console.log("Service Worker registrado");
            })
            .catch(error => {
                console.error("Error Service Worker:", error);
            });
    });
}
