<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Mi Calendario Escolar</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

        }


        body {

            overscroll-behavior: none;

        }



        /* =========================
           APP
        ========================= */

        .app {

            width: 100%;
            height: 100%;

            height: 100svh;
            height: 100dvh;

            display: flex;

            overflow-x: auto;
            overflow-y: hidden;

            position: relative;

            /*
             * El navegador se encarga del
             * desplazamiento horizontal.
             */

            scroll-snap-type: x mandatory;

            scroll-behavior: smooth;

            scrollbar-width: none;

            /*
             * Evita que el gesto horizontal
             * se propague fuera de la aplicación.
             */

            overscroll-behavior-x: contain;

            /*
             * Permitimos desplazamiento
             * horizontal con el dedo.
             */

            touch-action: pan-x;

        }


        .app::-webkit-scrollbar {

            display: none;

        }



        /* =========================
           PANTALLAS
        ========================= */

        .pantalla {

            flex: 0 0 100%;

            width: 100%;

            height: 100%;

            height: 100svh;
            height: 100dvh;

            min-width: 100%;

            display: flex;

            flex-direction: column;

            /*
             * Cada pantalla es un punto
             * de "encaje".
             */

            scroll-snap-align: start;

            scroll-snap-stop: always;

            /*
             * Respeta el notch del móvil.
             */

            padding-top:
                max(30px, env(safe-area-inset-top));

            padding-right:
                max(45px, env(safe-area-inset-right));

            padding-bottom:
                max(30px, env(safe-area-inset-bottom));

            padding-left:
                max(45px, env(safe-area-inset-left));

        }



        /* =========================
           CABECERA
        ========================= */

        .cabecera {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            flex-shrink: 0;

        }


        .titulo {

            font-size: 42px;

            font-weight: bold;

        }


        .hora {

            font-size: 32px;

            font-weight: bold;

        }


        .fecha {

            font-size: 20px;

            opacity: 0.75;

            margin-top: 4px;

        }



        /* =========================
           HORARIO
        ========================= */

        #horario {

            background: #111827;

        }


        .horario-imagen {

            flex: 1;

            min-height: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        .horario-imagen img {

            /*
             * Nunca puede superar el
             * espacio disponible.
             */

            max-width: 95%;

            max-height: 100%;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 15px;

            user-select: none;

            -webkit-user-drag: none;

        }



        /* =========================
           TAREAS
        ========================= */

        #tareas {

            background: #172554;

            overflow: hidden;

        }


        .lista-tareas {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding-right: 5px;

            padding-bottom: 30px;

            /*
             * El scroll vertical de tareas
             * sigue funcionando con el dedo.
             */

            touch-action: pan-y;

            overscroll-behavior-y: contain;

        }



        /* =========================
           SECCIONES
        ========================= */

        .seccion-tareas {

            margin-bottom: 30px;

        }


        .titulo-seccion {

            font-size: 27px;

            font-weight: bold;

            margin-top: 10px;

            margin-bottom: 12px;

            padding-bottom: 8px;

            border-bottom:
                2px solid rgba(255,255,255,0.15);

        }



        /* =========================
           TARJETA
        ========================= */

        .tarea {

            background:
                rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 18px 20px;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .tarea-nombre {

            font-size: 25px;

            font-weight: bold;

        }


        .tarea-info {

            font-size: 18px;

            opacity: 0.75;

            margin-top: 5px;

        }


        .prioridad {

            font-size: 20px;

            white-space: nowrap;

        }



        /* =========================
           VENCIDAS
        ========================= */

        .tarea-vencida {

            background:
                rgba(127,29,29,0.45);

            border-left:
                5px solid #ef4444;

        }


        .tarea-vencida .tarea-nombre {

            color: #fecaca;

        }



        /* =========================
           HECHAS
        ========================= */

        .tarea-hecha {

            background:
                rgba(0,0,0,0.25);

            opacity: 0.55;

            border-left:
                5px solid #6b7280;

        }


        .tarea-hecha .tarea-nombre {

            text-decoration: line-through;

        }


        .tarea-hecha .tarea-info {

            text-decoration: line-through;

        }



        /* =========================
           CALENDARIO
        ========================= */

        #calendario {

            background: #312e81;

            overflow: hidden;

        }


        #listaEventos {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding-bottom: 30px;

            touch-action: pan-y;

            overscroll-behavior-y: contain;

        }


        .evento {

            background:
                rgba(255,255,255,0.1);

            border-radius: 15px;

            padding: 20px;

            margin-top: 15px;

        }


        .evento-nombre {

            font-size: 25px;

            font-weight: bold;

        }


        .evento-fecha {

            font-size: 18px;

            margin-top: 5px;

            opacity: 0.75;

        }



        /* =========================
           MENSAJES
        ========================= */

        .mensaje {

            margin-top: 30px;

            font-size: 24px;

            opacity: 0.65;

        }


        .error {

            color: #fca5a5;

            font-size: 18px;

            margin-top: 20px;

        }



        /* =========================
           INDICADORES
        ========================= */

        .indicadores {

            position: fixed;

            bottom:
                max(15px, env(safe-area-inset-bottom));

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 100;

            pointer-events: none;

        }


        .punto {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: white;

            opacity: 0.4;

            transition: opacity 0.2s;

        }


        .punto.activo {

            opacity: 1;

        }



        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .pantalla {

                padding-left: 20px;

                padding-right: 20px;

            }


            .titulo {

                font-size: 30px;

            }


            .hora {

                font-size: 25px;

            }


            .fecha {

                font-size: 15px;

            }


            .tarea-nombre {

                font-size: 20px;

            }


            .tarea-info {

                font-size: 16px;

            }


            .prioridad {

                font-size: 17px;

            }


            .titulo-seccion {

                font-size: 23px;

            }


            .evento-nombre {

                font-size: 21px;

            }

        }

    </style>
</head>


<body>


<div class="app" id="app">


    <!-- =========================
         PANTALLA 1
    ========================= -->

    <section class="pantalla" id="horario">

        <div class="cabecera">

            <div class="titulo">
                🏫 HORARIO
            </div>


            <div style="text-align:right;">

                <div
                    class="hora"
                    id="hora"
                >
                    00:00
                </div>


                <div
                    class="fecha"
                    id="fecha"
                >
                    20 de agosto de 2026
                </div>

            </div>

        </div>


        <div class="horario-imagen">

            <img
                src="horario.png"
                alt="Horario escolar"
                draggable="false"
            >

        </div>

    </section>



    <!-- =========================
         PANTALLA 2
    ========================= -->

    <section
        class="pantalla"
        id="tareas"
    >

        <div class="cabecera">

            <div class="titulo">
                📋 TAREAS
            </div>


            <div
                class="hora"
                id="hora2"
            >
                00:00
            </div>

        </div>


        <div
            class="lista-tareas"
            id="listaTareas"
        >

            <div class="mensaje">
                Cargando tareas...
            </div>

        </div>

    </section>



    <!-- =========================
         PANTALLA 3
    ========================= -->

    <section
        class="pantalla"
        id="calendario"
    >

        <div class="cabecera">

            <div class="titulo">
                📅 CALENDARIO
            </div>


            <div
                class="hora"
                id="hora3"
            >
                00:00
            </div>

        </div>


        <div id="listaEventos">

            <div class="mensaje">
                Cargando eventos...
            </div>

        </div>

    </section>

</div>



<!-- =========================
     INDICADORES
========================= -->

<div class="indicadores">

    <div class="punto activo"></div>

    <div class="punto"></div>

    <div class="punto"></div>

</div>



<script>


/* =========================
   API
========================= */

const API =
    "https://calendario-escolar-api.elkitsunelegendario.workers.dev";



/* =========================
   HORA
========================= */

function actualizarHora() {

    const ahora = new Date();

    const horas =
        String(
            ahora.getHours()
        ).padStart(2, "0");


    const minutos =
        String(
            ahora.getMinutes()
        ).padStart(2, "0");


    const hora =
        horas + ":" + minutos;


    document.getElementById(
        "hora"
    ).textContent = hora;


    document.getElementById(
        "hora2"
    ).textContent = hora;


    document.getElementById(
        "hora3"
    ).textContent = hora;


    const fecha =
        ahora.toLocaleDateString(
            "es-ES",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById(
        "fecha"
    ).textContent =
        fecha.charAt(0).toUpperCase() +
        fecha.slice(1);

}


actualizarHora();

setInterval(
    actualizarHora,
    1000
);



/* =========================
   TEXTO DE NOTION
========================= */

function obtenerTexto(propiedad) {

    if (!propiedad) {
        return "";
    }


    if (
        propiedad.type === "title"
    ) {

        return propiedad.title
            .map(
                x => x.plain_text
            )
            .join("");

    }


    if (
        propiedad.type === "rich_text"
    ) {

        return propiedad.rich_text
            .map(
                x => x.plain_text
            )
            .join("");

    }


    if (
        propiedad.type === "select"
    ) {

        return propiedad.select?.name || "";

    }


    if (
        propiedad.type === "status"
    ) {

        return propiedad.status?.name || "";

    }


    if (
        propiedad.type === "formula"
    ) {

        return propiedad.formula?.string || "";

    }


    return "";

}



/* =========================
   FECHA
========================= */

function obtenerFecha(propiedad) {

    if (
        !propiedad ||
        propiedad.type !== "date"
    ) {

        return "";

    }


    return propiedad.date?.start || "";

}



/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "";
    }


    const fechaObj =
        new Date(fecha);


    if (
        isNaN(fechaObj)
    ) {

        return fecha;

    }


    return fechaObj.toLocaleDateString(
        "es-ES",
        {
            day: "numeric",
            month: "long"
        }
    );

}



/* =========================
   FECHA SIN HORA
========================= */

function obtenerDia(fecha) {

    if (!fecha) {
        return null;
    }


    const partes =
        fecha
            .substring(0, 10)
            .split("-");


    if (
        partes.length !== 3
    ) {

        return null;

    }


    return new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

}



/* =========================
   HOY
========================= */

function obtenerHoy() {

    const ahora =
        new Date();


    return new Date(
        ahora.getFullYear(),
        ahora.getMonth(),
        ahora.getDate()
    );

}



/* =========================
   PRIORIDADES
========================= */

function nivelPrioridad(
    prioridad
) {

    const texto =
        prioridad
            .toLowerCase()
            .trim();


    if (
        texto.includes("urgente") ||
        texto.includes("🔴")
    ) {

        return 1;

    }


    if (
        texto.includes("normal") ||
        texto.includes("🟡")
    ) {

        return 2;

    }


    if (
        texto.includes("baja") ||
        texto.includes("🟢")
    ) {

        return 3;

    }


    return 4;

}



/* =========================
   TAREAS
========================= */

async function cargarTareas() {

    const contenedor =
        document.getElementById(
            "listaTareas"
        );


    try {

        const respuesta =
            await fetch(
                API + "/tasks"
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML =
            "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📚 No hay tareas</div>';

            return;

        }


        const tareas =
            datos.results.map(
                pagina => {

                    const propiedades =
                        pagina.properties;


                    const nombre =
                        obtenerTexto(
                            propiedades["Tarea"]
                        ) ||
                        "Tarea sin nombre";


                    const asignatura =
                        obtenerTexto(
                            propiedades[
                                "Asignatura "
                            ]
                        );


                    const fecha =
                        obtenerFecha(
                            propiedades[
                                "Fecha de entrega"
                            ]
                        );


                    const prioridad =
                        obtenerTexto(
                            propiedades[
                                "Prioridad"
                            ]
                        );


                    const estado =
                        obtenerTexto(
                            propiedades[
                                "Estado"
                            ]
                        );


                    return {

                        nombre,

                        asignatura,

                        fecha,

                        prioridad,

                        estado,

                        pagina

                    };

                }
            );



        /* =========================
           CLASIFICAR
        ========================= */

        const pendientes = [];

        const vencidas = [];

        const hechas = [];


        const hoy =
            obtenerHoy();


        tareas.forEach(
            tarea => {

                if (
                    tarea.estado
                        .toLowerCase()
                        .trim() === "hecha"
                ) {

                    hechas.push(
                        tarea
                    );

                    return;

                }


                if (!tarea.fecha) {

                    pendientes.push(
                        tarea
                    );

                    return;

                }


                const diaEntrega =
                    obtenerDia(
                        tarea.fecha
                    );


                if (!diaEntrega) {

                    pendientes.push(
                        tarea
                    );

                    return;

                }


                const diferencia =
                    Math.floor(
                        (
                            hoy.getTime() -
                            diaEntrega.getTime()
                        ) /
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    );


                if (
                    diferencia >= 1 &&
                    diferencia <= 3
                ) {

                    vencidas.push(
                        tarea
                    );

                }


                else if (
                    diferencia > 3
                ) {

                    return;

                }


                else {

                    pendientes.push(
                        tarea
                    );

                }

            }
        );



        /* =========================
           ORDENAR
        ========================= */

        pendientes.sort(
            (a, b) => {

                const prioridadA =
                    nivelPrioridad(
                        a.prioridad
                    );


                const prioridadB =
                    nivelPrioridad(
                        b.prioridad
                    );


                if (
                    prioridadA !==
                    prioridadB
                ) {

                    return
                        prioridadA -
                        prioridadB;

                }


                if (!a.fecha) {
                    return 1;
                }


                if (!b.fecha) {
                    return -1;
                }


                return (
                    new Date(a.fecha) -
                    new Date(b.fecha)
                );

            }
        );


        vencidas.sort(
            (a, b) => {

                const fechaA =
                    obtenerDia(
                        a.fecha
                    );


                const fechaB =
                    obtenerDia(
                        b.fecha
                    );


                return fechaA - fechaB;

            }
        );


        hechas.sort(
            (a, b) => {

                const fechaA =
                    a.pagina.last_edited_time
                        ? new Date(
                            a.pagina
                                .last_edited_time
                        )
                        : new Date(0);


                const fechaB =
                    b.pagina.last_edited_time
                        ? new Date(
                            b.pagina
                                .last_edited_time
                        )
                        : new Date(0);


                return fechaB - fechaA;

            }
        );



        /* =========================
           CREAR SECCIONES
        ========================= */

        crearSeccion(
            contenedor,
            "⚠️ VENCIDAS",
            vencidas,
            "vencida"
        );


        crearSeccion(
            contenedor,
            "📋 PENDIENTES",
            pendientes,
            "normal"
        );


        crearSeccion(
            contenedor,
            "✅ HECHAS",
            hechas,
            "hecha"
        );


    }

    catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar las tareas</div>';

    }

}



/* =========================
   CREAR SECCIÓN
========================= */

function crearSeccion(
    contenedor,
    titulo,
    tareas,
    tipo
) {

    const seccion =
        document.createElement(
            "div"
        );


    seccion.className =
        "seccion-tareas";


    const encabezado =
        document.createElement(
            "div"
        );


    encabezado.className =
        "titulo-seccion";


    encabezado.textContent =
        titulo;


    seccion.appendChild(
        encabezado
    );


    if (
        tareas.length === 0
    ) {

        const mensaje =
            document.createElement(
                "div"
            );


        mensaje.className =
            "mensaje";


        if (
            tipo === "vencida"
        ) {

            mensaje.textContent =
                "🎉 No hay tareas vencidas";

        }

        else if (
            tipo === "normal"
        ) {

            mensaje.textContent =
                "📚 No hay tareas pendientes";

        }

        else {

            mensaje.textContent =
                "✅ No hay tareas hechas";

        }


        seccion.appendChild(
            mensaje
        );

    }


    tareas.forEach(
        tareaDatos => {

            const tarea =
                document.createElement(
                    "div"
                );


            tarea.className =
                "tarea";


            if (
                tipo === "vencida"
            ) {

                tarea.classList.add(
                    "tarea-vencida"
                );

            }


            if (
                tipo === "hecha"
            ) {

                tarea.classList.add(
                    "tarea-hecha"
                );

            }


            tarea.innerHTML = `

                <div>

                    <div class="tarea-nombre">

                        ${tareaDatos.nombre}

                    </div>


                    <div class="tarea-info">

                        ${
                            tareaDatos.asignatura ||
                            "Sin asignatura"
                        }

                        ${
                            tareaDatos.fecha
                                ? " · " +
                                  formatearFecha(
                                      tareaDatos.fecha
                                  )
                                : ""
                        }

                    </div>

                </div>


                <div class="prioridad">

                    ${
                        tareaDatos.prioridad ||
                        (
                            tipo === "vencida"
                                ? "⚠️ Vencida"
                                : ""
                        )
                    }

                </div>

            `;


            seccion.appendChild(
                tarea
            );

        }
    );


    contenedor.appendChild(
        seccion
    );

}



/* =========================
   EVENTOS
========================= */

async function cargarEventos() {

    const contenedor =
        document.getElementById(
            "listaEventos"
        );


    try {

        const respuesta =
            await fetch(
                API + "/events"
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        contenedor.innerHTML =
            "";


        if (
            !datos.results ||
            datos.results.length === 0
        ) {

            contenedor.innerHTML =
                '<div class="mensaje">📅 No hay eventos</div>';

            return;

        }


        const eventos =
            datos.results.map(
                pagina => {

                    const propiedades =
                        pagina.properties;


                    let nombre = "";

                    let fecha = "";


                    for (
                        const clave in propiedades
                    ) {

                        const propiedad =
                            propiedades[
                                clave
                            ];


                        if (
                            !nombre &&
                            propiedad.type ===
                            "title"
                        ) {

                            nombre =
                                obtenerTexto(
                                    propiedad
                                );

                        }


                        if (
                            !fecha &&
                            propiedad.type ===
                            "date"
                        ) {

                            fecha =
                                obtenerFecha(
                                    propiedad
                                );

                        }

                    }


                    return {

                        nombre:
                            nombre ||
                            "Evento sin nombre",

                        fecha

                    };

                }
            );



        eventos.sort(
            (a, b) => {

                if (!a.fecha) {
                    return 1;
                }


                if (!b.fecha) {
                    return -1;
                }


                return (
                    new Date(a.fecha) -
                    new Date(b.fecha)
                );

            }
        );


        eventos.forEach(
            eventoDatos => {

                const evento =
                    document.createElement(
                        "div"
                    );


                evento.className =
                    "evento";


                evento.innerHTML = `

                    <div class="evento-nombre">

                        ${eventoDatos.nombre}

                    </div>


                    <div class="evento-fecha">

                        ${
                            eventoDatos.fecha
                                ? formatearFecha(
                                    eventoDatos.fecha
                                  )
                                : "Sin fecha"
                        }

                    </div>

                `;


                contenedor.appendChild(
                    evento
                );

            }
        );


    }

    catch (error) {

        console.error(error);


        contenedor.innerHTML =
            '<div class="error">⚠️ No se pudieron cargar los eventos</div>';

    }

}



/* =========================
   CARGAR DATOS
========================= */

cargarTareas();

cargarEventos();



/* =========================
   ACTUALIZAR CADA 30 SEGUNDOS
========================= */

setInterval(
    () => {

        cargarTareas();

        cargarEventos();

    },
    30 * 1000
);



/* =========================
   ACTUALIZAR AL VOLVER
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            cargarTareas();

            cargarEventos();

        }

    }
);



/* =========================
   NAVEGACIÓN
   NATIVA CON SCROLL-SNAP
========================= */

const app =
    document.getElementById(
        "app"
    );


const puntos =
    document.querySelectorAll(
        ".punto"
    );


const pantallas =
    document.querySelectorAll(
        ".pantalla"
    );



/*
 * Determina qué pantalla está
 * actualmente visible.
 */

function actualizarIndicador() {

    const ancho =
        app.clientWidth;


    if (!ancho) {
        return;
    }


    /*
     * Redondeamos la posición.
     * Esto evita problemas con valores
     * decimales del navegador.
     */

    let pagina =
        Math.round(
            app.scrollLeft /
            ancho
        );


    /*
     * Nunca salimos de 0-2.
     */

    pagina =
        Math.max(
            0,
            Math.min(
                2,
                pagina
            )
        );


    puntos.forEach(
        (punto, indice) => {

            punto.classList.toggle(
                "activo",
                indice === pagina
            );

        }
    );

}



/*
 * Actualizamos los puntos mientras
 * el usuario desliza.
 */

let ultimoScroll = 0;

let rafPendiente = false;


app.addEventListener(
    "scroll",
    () => {

        ultimoScroll =
            app.scrollLeft;


        if (rafPendiente) {
            return;
        }


        rafPendiente = true;


        requestAnimationFrame(
            () => {

                actualizarIndicador();

                rafPendiente = false;

            }
        );

    },
    {
        passive: true
    }
);



/*
 * Cuando termina el desplazamiento,
 * actualizamos definitivamente.
 */

app.addEventListener(
    "scrollend",
    () => {

        actualizarIndicador();

    },
    {
        passive: true
    }
);



/* =========================
   CLIC EN LOS PUNTOS
========================= */

puntos.forEach(
    (punto, indice) => {

        punto.addEventListener(
            "click",
            () => {

                app.scrollTo({

                    left:
                        indice *
                        app.clientWidth,

                    behavior:
                        "smooth"

                });

            }
        );

    }
);



/* =========================
   EVITAR ARRASTRAR IMÁGENES
========================= */

document
    .querySelectorAll("img")
    .forEach(
        img => {

            img.addEventListener(
                "dragstart",
                evento => {

                    evento.preventDefault();

                }
            );

        }
    );



/* =========================
   AJUSTAR AL CAMBIAR
   TAMAÑO DE VENTANA
========================= */

window.addEventListener(
    "resize",
    () => {

        /*
         * Recolocamos la pantalla actual
         * sin usar transform.
         */

        const pagina =
            Math.round(
                app.scrollLeft /
                app.clientWidth
            );


        app.scrollTo({

            left:
                pagina *
                app.clientWidth,

            behavior:
                "instant"

        });


        actualizarIndicador();

    }
);



/* =========================
   INICIO
========================= */

app.scrollLeft = 0;

actualizarIndicador();

</script>

</body>
</html>
